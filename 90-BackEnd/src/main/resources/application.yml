spring:
  application:
    name: 90-BackEnd

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-weathered-wind-ax6w58sv-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # La base manda: el esquema real lo crean las migraciones Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0 # nunca "1": si no, Flyway trata V1 como ya aplicada y la salta

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      # 180 días: login persistente hasta logout explícito o desinstalar la app (uso local personal)
      expiration-ms: ${JWT_EXPIRATION_MS:15552000000}
  google:
    client-id: ${GOOGLE_ANDROID_CLIENT_ID:711330016273-vq3bq50eehk8fm2m6va9nhbbmbldj4b0.apps.googleusercontent.com}
  contenido:
    youtube-api-key: ${YOUTUBE_API_KEY:}
    google-books-api-key: ${GOOGLE_BOOKS_API_KEY:}
