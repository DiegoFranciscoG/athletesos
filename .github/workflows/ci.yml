name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . --redact --verbose --exit-code 1

  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest
    needs: secretos
    defaults:
      run:
        working-directory: 90-BackEnd
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar backend
        run: ./mvnw -B -ntp compile

  frontend:
    name: App Flutter
    runs-on: ubuntu-latest
    needs: secretos
    steps:
      - uses: actions/checkout@v4
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencias
        run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Tests
        run: flutter test
